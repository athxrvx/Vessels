[package]
name = "vessels"
version = "0.1.0"
edition = "2021"
authors = ["Atharva"]
description = "Native COSMIC desktop container and development environment manager"
license = "GPL-3.0-or-later"

[dependencies]
# GUI Toolkit - Native COSMIC Desktop
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["tokio", "wayland", "wgpu", "xdg-portal"] }

# Async Runtime & Utilities
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Container Runtime Client (Podman and Docker Unix socket APIs)
bollard = "0.18"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Standard XDG Paths
dirs = "6.0"
